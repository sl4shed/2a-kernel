name: Build Kernel

permissions:
  contents: write
  actions: write

# This workflow runs the same scripts as the manual build (see README):
#   source scripts/manual/setup_vars.sh -> scripts/manual/setup_repos.sh
#   -> scripts/build_kernel.sh -> scripts/package_anykernel.sh
# Empty string inputs fall back to the defaults in scripts/manual/setup_vars.sh.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo (empty = setup_vars.sh default, NothingOSS mt6886)'
        required: false
        type: string
        default: ''
      kernel_branch:
        description: 'Kernel branch (empty = setup_vars.sh default, mt6886/Pacman/16b)'
        required: false
        type: string
        default: ''
      kernel_defconfig:
        description: 'Defconfig(s), space-separated. Use /name if it is in the kernel root (empty = gki_defconfig)'
        required: false
        type: string
        default: ''
      extra_configs:
        description: 'Extra config fragments (space-separated, start with / if it is in the kernel root)'
        required: false
        type: string
        default: ''
      extra_user_cfg:
        description: 'Space-separated CONFIG_X=y/n overrides (empty = setup_vars.sh default, ThinLTO)'
        required: false
        type: string
        default: ''
      extra_patches_dir:
        description: 'Repo-local patch directory applied after cloning (empty = patches/nothing-2a)'
        required: false
        type: string
        default: ''
      susfs_branch:
        description: 'SUSFS branch, also selects the patch name (empty = gki-android13-5.15)'
        required: false
        type: string
        default: ''
      kernel_type:
        description: 'Kernel type identifier used in the zip name (empty = NothingOSS)'
        required: false
        type: string
        default: ''
      kpm_support:
        description: 'Enable KPM support'
        required: false
        type: boolean
        default: true
      susfs_support:
        description: 'Enable SUSFS support'
        required: false
        type: boolean
        default: true
      susfs_force:
        description: 'Force SUSFS patch apply (ignore failures)'
        required: false
        type: boolean
        default: false
      bbg_support:
        description: 'Enable BBG support'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.kernel_defconfig }}
      DEFCONFIG_FRAGS: ${{ inputs.extra_configs }}
      EXTRA_USER_CFG: ${{ inputs.extra_user_cfg }}
      EXTRA_PATCHES_DIR: ${{ inputs.extra_patches_dir }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch }}
      KERNEL_TYPE: ${{ inputs.kernel_type }}
      KPM_SUPPORT: ${{ inputs.kpm_support }}
      SUSFS_SUPPORT: ${{ inputs.susfs_support }}
      SUSFS_FORCE: ${{ inputs.susfs_force }}
      BBG_SUPPORT: ${{ inputs.bbg_support }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev ccache \
            lz4 zip python3 clang llvm lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi wget curl cpio dwarves

      - name: Show build settings
        run: |
          source scripts/manual/setup_vars.sh
          for v in KERNEL_REPO KERNEL_BRANCH DEFCONFIG DEFCONFIG_FRAGS EXTRA_USER_CFG \
                   EXTRA_PATCHES_DIR SUSFS_BRANCH KERNEL_TYPE KPM_SUPPORT SUSFS_SUPPORT \
                   SUSFS_FORCE BBG_SUPPORT; do
            echo "$v=${!v}"
          done
          echo "ZIP_NAME=kernel-${KERNEL_TYPE}-2a-ReSukiSU" >> "$GITHUB_ENV"

      - name: Set up sources (setup_repos.sh)
        run: |
          source scripts/manual/setup_vars.sh
          scripts/manual/setup_repos.sh

      - name: Enable swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if sudo fallocate -l 12G /swapfile; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile || echo "Swap not permitted on this runner"
          else
            echo "Swap file allocation failed; continuing without swap"
          fi

      - name: Build kernel (build_kernel.sh)
        run: |
          source scripts/manual/setup_vars.sh
          scripts/build_kernel.sh

      - name: Package AnyKernel3 (package_anykernel.sh)
        run: |
          source scripts/manual/setup_vars.sh
          scripts/package_anykernel.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30

      - name: Upload .config for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-2a-ReSukiSU
          path: kernel/out/.config
          retention-days: 1
          if-no-files-found: ignore

      - name: Collect .rej files
        if: always()
        id: collect_rej
        run: |
          mkdir -p rej
          found="false"
          while IFS= read -r -d '' f; do
            found="true"
            mkdir -p "rej/$(dirname "$f")"
            cp "$f" "rej/$f"
            orig="${f%.rej}"
            [ -f "$orig" ] && cp "$orig" "rej/$orig"
          done < <(find . -name '*.rej' -print0)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Upload .rej files
        if: always() && steps.collect_rej.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rej-2a-ReSukiSU
          path: rej/
